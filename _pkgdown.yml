url: https://grading-accuracy-study.github.io/GradingAccuracy/
template:
  bootstrap: 5

reference:
- title: Data Cleaning and Preparation
  desc: >
    These functions are for preparing the original exports for accuracy computations, by deidentifying identifiable information and making any adjustments to rubric items.
  contents:
  - read_evals
  - validate_metadata_json
  - update_scores
  - update_scores_in_metadata
  - deidentify_graders
  - deidentify_gradescope_evals
  - generate_rubric_texts
  - normalize_full_credit

- title: Accuracy Functions
  desc: >
    These functions are for computing the accuracy rates between different graders.
  contents:
  - generate_metadata_table
  - generate_results_table
  - generate_gt_results_table
  - expert_updates_table
  - export_grading_differences_xlsx
  - export_grading_differences_gt
  - find_differences_wrt_AI
  - find_differences_wrt_students
  - compute_mae_and_isp
  - isp
  - rubric_mae
